[package]
name = "graphify-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File discovery and classification for graphify"

[dependencies]
graphify-core.workspace = true
graphify-cache.workspace = true
regex.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
globset = "0.4"
walkdir = "2"
# Office (.docx/.xlsx) content extraction: both formats are zip+XML containers.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
